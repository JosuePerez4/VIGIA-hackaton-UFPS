<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MX6 iBrid: dispositivo y uso en el cuerpo (modelo conceptual)</title>
<style>
:root {
  --bg: #f3f5f8;
  --fg: #1b2230;
  --muted: #5a6477;
  --line: #3a4560;
  --chip: #ffffffd9;
  --border: #cfd5e0;
  --accent: #1f5fd6;
  --accent-fg: #ffffff;
  --lw: 210px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d;
    --fg: #e7ebf3;
    --muted: #9aa4b8;
    --line: #a9b4cc;
    --chip: #1a2030d9;
    --border: #2d3548;
    --accent: #7aa2ff;
    --accent-fg: #0c1220;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d;
  --fg: #e7ebf3;
  --muted: #9aa4b8;
  --line: #a9b4cc;
  --chip: #1a2030d9;
  --border: #2d3548;
  --accent: #7aa2ff;
  --accent-fg: #0c1220;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%;
  overflow: hidden;
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: flex; flex-direction: column; }
header { padding: 14px 18px 0; }
h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -0.01em; }
.tabs { display: flex; gap: 6px; padding: 12px 18px 10px; }
.tabs button { padding: 7px 14px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#wires line { stroke: var(--line); stroke-width: 1; opacity: 0.7; }
#wires circle { fill: var(--line); }
.lb {
  position: absolute;
  top: 0;
  width: var(--lw);
  font-size: 0.9rem;
  line-height: 1.3;
  padding: 5px 8px;
  border-radius: 6px;
  background: var(--chip);
  border: 1px solid transparent;
  cursor: default;
  transition: border-color 0.15s;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}
.lb.l { left: 12px; text-align: left; }
.lb.r { right: 12px; text-align: right; }
.lb.on { border-color: var(--accent); }
.lb small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 1px; }
.hide-labels .lb, .hide-labels #wires { display: none; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
}
.bar label { font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
input[type="range"] { width: min(260px, 40vw); accent-color: var(--accent); }
button {
  font: inherit;
  font-size: 0.875rem;
  padding: 6px 12px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button[aria-pressed="true"] { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app[data-view="worn"] .only-device { display: none; }
.app[data-view="device"] .only-worn { display: none; }
#err { display: none; padding: 24px; color: var(--muted); }
@media (max-width: 720px) {
  :root { --lw: 124px; }
  .lb { font-size: 0.8rem; padding: 4px 6px; }
  .lb small { display: none; }
}
</style>
</head>
<body>
<div class="app" data-view="device">
  <header>
    <h1>Industrial Scientific MX6 iBrid</h1>
  </header>
  <div class="tabs" role="tablist">
    <button id="tab-device" type="button" role="tab" aria-selected="true">Dispositivo explosionado</button>
    <button id="tab-worn" type="button" role="tab" aria-selected="false">Puesto en el cuerpo</button>
  </div>
  <div id="stage">
    <svg id="wires" aria-hidden="true"></svg>
  </div>
  <div id="err">Tu navegador no pudo iniciar WebGL, así que no se puede mostrar el modelo 3D.</div>
  <div class="bar">
    <label class="only-device" for="ex">Explosión
      <input id="ex" type="range" min="0" max="1" step="0.001" value="0">
    </label>
    <button id="toggle" class="primary only-device" type="button">Ensamblar</button>
    <button id="pump" class="only-device" type="button" aria-pressed="true">Con bomba</button>
    <button id="chest" class="only-worn" type="button">Acercar al pecho</button>
    <button id="full" class="only-worn" type="button">Cuerpo completo</button>
    <button id="spin" type="button" aria-pressed="true">Giro automático</button>
    <button id="reset" class="only-device" type="button">Restablecer vista</button>
    <button id="lbl" type="button" aria-pressed="true">Etiquetas</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var app = document.querySelector('.app');
  var stage = document.getElementById('stage');
  var wires = document.getElementById('wires');
  var NS = 'http://www.w3.org/2000/svg';
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    stage.style.display = 'none';
    document.getElementById('err').style.display = 'block';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.insertBefore(renderer.domElement, wires);

  var V = function (x, y, z) { return new THREE.Vector3(x, y, z); };

  function mat(color, o) {
    o = o || {};
    var m = new THREE.MeshStandardMaterial({
      color: color,
      roughness: o.rough !== undefined ? o.rough : 0.55,
      metalness: o.metal !== undefined ? o.metal : 0.05
    });
    if (o.opacity !== undefined) {
      m.transparent = true;
      m.opacity = o.opacity;
      m.depthWrite = false;
    }
    return m;
  }
  function withEdges(mesh, strength) {
    mesh.add(new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({ color: 0x1f2740, transparent: true, opacity: strength === undefined ? 0.32 : strength })
    ));
    return mesh;
  }
  function box(w, h, d, color, o) {
    o = o || {};
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o));
    if (o.edges !== false) withEdges(m, o.edgeStrength);
    return m;
  }
  function cyl(r, h, color, o) {
    o = o || {};
    var g = new THREE.CylinderGeometry(r, r, h, o.seg || 28);
    if (o.axis === 'z') g.rotateX(Math.PI / 2);
    if (o.axis === 'x') g.rotateZ(Math.PI / 2);
    var m = new THREE.Mesh(g, mat(color, o));
    if (o.edges) withEdges(m);
    return m;
  }
  function sph(r, color) {
    return new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(color, { rough: 0.7 }));
  }
  function put(group, mesh, x, y, z) {
    mesh.position.set(x, y, z);
    group.add(mesh);
    return mesh;
  }
  function textTexture(lines, w, h, bg, colors, size) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.fillStyle = bg;
    x.fillRect(0, 0, w, h);
    x.textBaseline = 'middle';
    x.font = 'bold ' + size + 'px "Courier New", monospace';
    lines.forEach(function (t, i) {
      x.fillStyle = colors[i % colors.length];
      x.fillText(t, 22, (h / (lines.length + 1)) * (i + 1));
    });
    var tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    return tex;
  }
  function glow(obj, on) {
    obj.traverse(function (o) {
      if (o.isMesh && o.material && o.material.emissive) {
        o.material.emissive.setHex(on ? 0x2a5fe0 : 0x000000);
        o.material.emissiveIntensity = on ? 0.55 : 0;
      }
    });
  }

  function makeView(name, pos, target, minD, maxD, zoomAspect) {
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 120);
    camera.position.copy(pos);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = minD;
    controls.maxDistance = maxD;
    controls.autoRotateSpeed = 2.0;
    controls.update();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a94a8, 0.95));
    var key = new THREE.DirectionalLight(0xffffff, 0.75);
    key.position.set(7, 10, 9);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
    fill.position.set(-8, -3, 6);
    scene.add(fill);
    var g = document.createElementNS(NS, 'g');
    wires.appendChild(g);
    return { name: name, scene: scene, camera: camera, controls: controls, home: { pos: pos.clone(), target: target.clone() },
      parts: {}, defs: [], g: g, zoomAspect: zoomAspect };
  }
  var dv = makeView('device', V(9.5, 4.5, 12.5), V(0, 0, 1.0), 8, 38, 1.2);
  var wv = makeView('worn', V(2.6, 5.6, 5.8), V(-0.1, 5.2, 0.4), 2.2, 26, 0.75);

  function part(view, key, pos, dir) {
    var g = new THREE.Group();
    g.position.copy(pos);
    g.userData = { base: pos.clone(), dir: dir.clone() };
    view.scene.add(g);
    view.parts[key] = g;
    return g;
  }

  var YEL = 0xf2c230, CHAR = 0x2b2f38;

  var shell = part(dv, 'shell', V(0, 0, 0), V(0, 0, 0));
  put(shell, box(2.57, 4.5, 0.15, YEL), 0, 0, -0.625);
  put(shell, box(2.57, 0.14, 1.0, YEL), 0, 2.18, -0.05);
  put(shell, box(2.57, 0.14, 1.0, YEL), 0, -2.18, -0.05);
  put(shell, box(0.14, 4.22, 1.0, YEL), -1.215, 0, -0.05);
  put(shell, box(0.14, 4.22, 1.0, YEL), 1.215, 0, -0.05);
  [-1, 1].forEach(function (sx) {
    [-1, 1].forEach(function (sy) {
      put(shell, box(0.42, 0.42, 1.12, CHAR, { edges: false }), sx * 1.18, sy * 2.15, -0.05);
    });
  });
  put(shell, cyl(0.26, 0.12, 0xdfe4ee, { edges: true }), 0, 2.33, -0.05);
  put(shell, cyl(0.12, 0.2, CHAR), 0, 2.5, -0.05);

  var clip = part(dv, 'clip', V(0, 0, 0), V(0, -0.5, -2.4));
  put(clip, box(0.9, 2.0, 0.1, 0x22262e), 0, -0.4, -0.78);
  put(clip, box(0.9, 0.12, 0.4, 0x22262e), 0, -1.45, -0.98);

  var battTex = textTexture(['Li-ion'], 400, 120, '#e6e9f0', ['#2a3142'], 62);
  var batt = part(dv, 'battery', V(0, -1.05, -0.4), V(0, -1.0, 0.9));
  put(batt, box(2.1, 1.7, 0.4, 0x3d4658), 0, 0, 0);
  put(batt, new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.42), new THREE.MeshBasicMaterial({ map: battTex })), 0, 0.15, 0.205);
  [-0.5, 0, 0.5].forEach(function (x) {
    put(batt, box(0.2, 0.12, 0.12, 0xd4a73a, { edges: false }), x, -0.9, 0);
  });

  var pump = part(dv, 'pump', V(0, 1.1, -0.4), V(0, 1.0, 0.9));
  put(pump, box(2.0, 1.7, 0.4, 0x727b8e), 0, 0, 0);
  put(pump, cyl(0.42, 0.22, 0x20242c, { axis: 'z', edges: true }), -0.45, 0, 0.3);
  put(pump, cyl(0.3, 0.16, 0xaeb6c6, { axis: 'z', edges: true }), 0.5, 0, 0.28);
  put(pump, cyl(0.06, 0.8, 0x20242c), 0.5, 1.0, 0.1);

  var sensors = part(dv, 'sensors', V(0, 0, -0.12), V(0, 0, 1.9));
  put(sensors, box(2.2, 3.9, 0.06, 0x2f8f57), 0, 0, 0);
  var senColors = [0xe9a21b, 0x3b82f6, 0x9aa3b4, 0xe5484d, 0x14b88a, 0x8b6cf0];
  var si = 0;
  [1.2, 0, -1.2].forEach(function (y) {
    [-0.55, 0.55].forEach(function (x) {
      put(sensors, cyl(0.3, 0.3, senColors[si], { axis: 'z', edges: true }), x, y, 0.18);
      put(sensors, cyl(0.17, 0.04, 0x1c212c, { axis: 'z' }), x, y, 0.34);
      si++;
    });
  });

  var pcb = part(dv, 'pcb', V(0, 0, 0.26), V(0, 0, 3.2));
  put(pcb, box(2.3, 4.1, 0.06, 0x2f9e5a), 0, 0, 0);
  put(pcb, box(1.95, 1.35, 0.1, 0x0e1119), 0, 1.0, 0.08);
  [[-0.6, -0.2, 0.7, 0.55], [0.5, -0.3, 0.55, 0.5], [0.4, -1.0, 0.8, 0.45], [-0.7, -1.0, 0.5, 0.4]].forEach(function (c) {
    put(pcb, box(c[2], c[3], 0.09, 0x151a25), c[0], c[1], 0.07);
  });
  put(pcb, cyl(0.3, 0.15, 0x1a1d24, { axis: 'z', edges: true }), 0, -1.6, 0.1);

  var cover = part(dv, 'cover', V(0, 0, 0.53), V(0, 0, 4.8));
  put(cover, box(2.57, 4.5, 0.14, CHAR), 0, 0, 0);
  var scrTex = textTexture(['O2    20.9 %vol', 'LEL    0   %', 'CO     0   ppm', 'H2S  0.0   ppm'], 640, 440, '#0a111e', ['#58e08a'], 50);
  put(cover, box(2.1, 1.5, 0.02, 0x14171d, { edges: false }), 0, 1.0, 0.071);
  put(cover, new THREE.Mesh(new THREE.PlaneGeometry(1.95, 1.34), new THREE.MeshBasicMaterial({ map: scrTex })), 0, 1.0, 0.083);
  var ledR = cyl(0.1, 0.05, 0xe5484d, { axis: 'z' });
  ledR.material = new THREE.MeshBasicMaterial({ color: 0xe5484d });
  put(cover, ledR, -0.9, 2.0, 0.08);
  var ledB = cyl(0.1, 0.05, 0x3b82f6, { axis: 'z' });
  ledB.material = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
  put(cover, ledB, 0.9, 2.0, 0.08);
  put(cover, cyl(0.42, 0.05, 0x454b58, { axis: 'z', edges: true }), 0, -0.55, 0.095);
  put(cover, cyl(0.16, 0.06, 0x1c2028, { axis: 'z' }), 0, -0.55, 0.11);
  [[0, 0.27], [0, -0.27], [-0.27, 0], [0.27, 0]].forEach(function (p) {
    put(cover, box(0.16, 0.1, 0.04, 0xaab3c5, { edges: false }), p[0], -0.55 + p[1], 0.12);
  });
  [-0.2, 0, 0.2].forEach(function (x) {
    [-1.4, -1.55, -1.7].forEach(function (y) {
      put(cover, cyl(0.04, 0.02, 0x0c0e12, { axis: 'z' }), x, y, 0.075);
    });
  });

  var pumpOn = true;
  var dvDefs = [
    { side: 'r', t: 'Pantalla a color', s: 'Lecturas en tiempo real', part: 'cover', p: [0.75, 1.3, 0.09] },
    { side: 'r', t: 'Teclado de cinco vías', s: 'Para navegar el menú', part: 'cover', p: [0.3, -0.7, 0.12] },
    { side: 'r', t: 'Alarmas visual y sonora', s: 'La sonora llega a 95 dB', part: 'cover', p: [0.9, 2.0, 0.09] },
    { side: 'r', t: 'Placa principal', s: 'Procesamiento y registro de datos', part: 'pcb', p: [-0.8, -0.9, 0.1] },
    { side: 'l', t: 'Puerto de muestreo', s: 'Con filtro de entrada', part: 'shell', p: [0, 2.5, -0.05] },
    { side: 'l', t: 'Sensores enchufables', s: 'Hasta seis gases, intercambiables', part: 'sensors', p: [-0.55, 1.2, 0.36] },
    { side: 'l', t: 'Bomba de muestreo', s: 'Opcional; aspira muestras a distancia', part: 'pump', p: [-0.45, 0.3, 0.4], vis: function () { return pumpOn; } },
    { side: 'l', t: 'Batería recargable', s: 'Ion de litio', part: 'battery', p: [0.7, -0.4, 0.21] },
    { side: 'l', t: 'Carcasa con sobremoldeado', s: 'Resistente a golpes', part: 'shell', p: [-1.28, -0.5, -0.05] },
    { side: 'l', t: 'Clip de cinturón', s: 'Accesorio de sujeción', part: 'clip', p: [0, 0.4, -0.84] }
  ];
  dvDefs.forEach(function (d) {
    d.anchor = function () {
      var v = V(d.p[0], d.p[1], d.p[2]);
      dv.parts[d.part].localToWorld(v);
      return v;
    };
    d.target = dv.parts[d.part];
    d.on = function () { glow(d.target, true); };
    d.off = function () { glow(d.target, false); };
  });
  dv.defs = dvDefs;

  var W = wv.scene;
  var skin = 0xe0b48f, pants = 0x2c3a52, shirt = 0x3b6ea8, vest = 0xff7a1a, refl = 0xe8ecf3, hat = 0xf2c230, dark = 0x1b1f27;
  function addW(m, x, y, z) { m.position.set(x, y, z); W.add(m); return m; }

  [-0.42, 0.42].forEach(function (x) {
    addW(cyl(0.4, 3.0, pants, { seg: 20 }), x, 1.5, 0);
    addW(box(0.85, 0.3, 1.2, dark), x, 0.15, 0.15);
  });
  addW(box(1.8, 2.3, 0.9, shirt), 0, 4.15, 0);
  [-0.5, 0.5].forEach(function (x) {
    addW(box(0.62, 2.25, 0.05, vest), x, 4.15, 0.475);
    addW(box(0.62, 0.16, 0.056, refl, { edges: false }), x, 4.5, 0.478);
    addW(box(0.62, 0.16, 0.056, refl, { edges: false }), x, 3.7, 0.478);
    addW(box(0.62, 0.08, 0.95, vest), x, 5.31, 0);
  });
  addW(box(1.8, 2.25, 0.05, vest), 0, 4.15, -0.475);
  addW(box(1.8, 0.16, 0.056, refl, { edges: false }), 0, 4.5, -0.478);
  addW(box(1.8, 0.16, 0.056, refl, { edges: false }), 0, 3.7, -0.478);
  addW(box(1.86, 0.2, 0.96, dark), 0, 3.05, 0);
  addW(box(0.3, 0.22, 0.03, 0xb8bfcc, { edges: false }), 0, 3.05, 0.49);
  [-1, 1].forEach(function (s) {
    addW(sph(0.32, shirt), s * 1.12, 5.1, 0);
    addW(cyl(0.27, 2.1, shirt, { seg: 20 }), s * 1.15, 4.1, 0);
    addW(sph(0.26, skin), s * 1.15, 2.85, 0);
  });
  addW(cyl(0.2, 0.35, skin, { seg: 20 }), 0, 5.5, 0);
  addW(sph(0.55, skin), 0, 6.1, 0.02);
  [-0.2, 0.2].forEach(function (x) {
    addW(sph(0.06, 0x111111), x, 6.1, 0.54);
  });
  var dome = new THREE.Mesh(new THREE.SphereGeometry(0.62, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), mat(hat, { rough: 0.4 }));
  dome.material.side = THREE.DoubleSide;
  addW(dome, 0, 6.2, 0);
  addW(cyl(0.74, 0.05, hat, { seg: 32 }), 0, 6.2, 0.04);
  addW(box(0.3, 0.18, 0.14, CHAR), 0, 6.5, 0.6);
  var lens = box(0.18, 0.1, 0.02, 0xfff4c2, { edges: false });
  lens.material = new THREE.MeshBasicMaterial({ color: 0xfff4c2 });
  addW(lens, 0, 6.5, 0.68);

  var bzMat = new THREE.MeshBasicMaterial({ color: 0x19c3a6, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false });
  var bz = new THREE.Mesh(new THREE.SphereGeometry(1.0, 36, 20, 0, Math.PI, 0, Math.PI), bzMat);
  addW(bz, 0, 5.85, 0.1);
  var bzWire = new THREE.Mesh(new THREE.SphereGeometry(1.0, 18, 10, 0, Math.PI, 0, Math.PI),
    new THREE.MeshBasicMaterial({ color: 0x19c3a6, wireframe: true, transparent: true, opacity: 0.28, depthWrite: false }));
  addW(bzWire, 0, 5.85, 0.1);

  var devScreen = textTexture(['O2    20.9', 'CO     0', 'H2S  0.0'], 400, 300, '#0a111e', ['#58e08a'], 48);
  var dev = new THREE.Group();
  dev.add(box(0.31, 0.54, 0.16, YEL));
  put(dev, box(0.31, 0.54, 0.05, CHAR), 0, 0, 0.105);
  put(dev, new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.19), new THREE.MeshBasicMaterial({ map: devScreen })), 0, 0.12, 0.133);
  put(dev, cyl(0.07, 0.02, 0x454b58, { axis: 'z' }), 0, -0.14, 0.133);
  put(dev, box(0.16, 0.42, 0.03, 0x22262e), 0, 0, -0.095);
  dev.position.set(-0.5, 5.0, 0.66);
  W.add(dev);

  var floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 40), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.12, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.01;
  W.add(floor);

  var wvDefs = [
    { side: 'l', t: 'Detector MX6 iBrid', s: 'Con su clip, en la correa del chaleco o arnés', anchor: function () { return dev.localToWorld(V(0, 0, 0.14)); }, target: dev },
    { side: 'l', t: 'Chaleco reflectante', s: 'Sus correas sirven para sujetarlo', anchor: function () { return V(-0.6, 3.9, 0.51); }, target: null },
    { side: 'r', t: 'Zona de respiración', s: 'Unos 25 cm alrededor de nariz y boca', anchor: function () { return V(0.7, 6.05, 0.78); }, target: null,
      on: function () { bzMat.opacity = 0.38; }, off: function () { bzMat.opacity = 0.14; } },
    { side: 'r', t: 'Casco con lámpara', s: 'Equipo típico en minería', anchor: function () { return V(0, 6.5, 0.69); }, target: null }
  ];
  wvDefs.forEach(function (d) {
    if (d.target && !d.on) {
      d.on = function () { glow(d.target, true); };
      d.off = function () { glow(d.target, false); };
    }
  });
  wv.defs = wvDefs;

  [dv, wv].forEach(function (view) {
    view.defs.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'lb ' + d.side;
      el.innerHTML = '<span>' + d.t + '</span><small>' + d.s + '</small>';
      stage.appendChild(el);
      d.el = el;
      d.line = document.createElementNS(NS, 'line');
      d.dot = document.createElementNS(NS, 'circle');
      d.dot.setAttribute('r', '3');
      view.g.appendChild(d.line);
      view.g.appendChild(d.dot);
      d.sticky = false;
      function on() { if (d.on) d.on(); el.classList.add('on'); }
      function off() { if (!d.sticky) { if (d.off) d.off(); el.classList.remove('on'); } }
      el.addEventListener('mouseenter', on);
      el.addEventListener('mouseleave', off);
      el.addEventListener('click', function () {
        d.sticky = !d.sticky;
        if (d.sticky) on(); else { if (d.off) d.off(); el.classList.remove('on'); }
      });
    });
  });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var curT = reduce ? 1 : 0;
  var goalT = 1;
  var dragging = false;
  var slider = document.getElementById('ex');
  var toggle = document.getElementById('toggle');
  var pumpBtn = document.getElementById('pump');
  var spin = document.getElementById('spin');
  var current = dv;
  slider.value = curT;

  /* Giro automático: cada vuelta completa de la vista del dispositivo alterna entre explotado y ensamblado. */
  var lastAz = 0;
  var turned = 0;
  var TWO_PI = Math.PI * 2;

  function setGoal(v) {
    goalT = v;
    toggle.textContent = goalT > 0.5 ? 'Ensamblar' : 'Explotar';
  }

  function trackTurn() {
    var az = current.controls.getAzimuthalAngle();
    var d = az - lastAz;
    if (d > Math.PI) d -= TWO_PI;
    if (d < -Math.PI) d += TWO_PI;
    lastAz = az;
    if (current !== dv || !dv.controls.autoRotate || dragging) return;
    turned += Math.abs(d);
    if (turned >= TWO_PI) {
      turned -= TWO_PI;
      setGoal(goalT > 0.5 ? 0 : 1);
    }
  }

  function applyT(t) {
    var e = t * t * (3 - 2 * t);
    Object.keys(dv.parts).forEach(function (k) {
      var g = dv.parts[k];
      g.position.copy(g.userData.base).addScaledVector(g.userData.dir, e);
    });
  }
  slider.addEventListener('input', function () {
    dragging = true;
    curT = parseFloat(slider.value);
    setGoal(curT);
  });
  slider.addEventListener('change', function () { dragging = false; });
  toggle.addEventListener('click', function () {
    setGoal(goalT > 0.5 ? 0 : 1);
  });
  pumpBtn.addEventListener('click', function () {
    pumpOn = !pumpOn;
    dv.parts.pump.visible = pumpOn;
    pumpBtn.setAttribute('aria-pressed', String(pumpOn));
    pumpBtn.textContent = pumpOn ? 'Con bomba' : 'Sin bomba';
  });
  spin.addEventListener('click', function () {
    current.controls.autoRotate = !current.controls.autoRotate;
    spin.setAttribute('aria-pressed', String(current.controls.autoRotate));
    spin.textContent = current.controls.autoRotate ? 'Giro automático' : 'Giro detenido';
  });
  document.getElementById('reset').addEventListener('click', function () {
    go(dv, dv.home.pos, dv.home.target);
  });
  function go(view, pos, target) {
    view.camera.position.copy(pos);
    view.controls.target.copy(target);
    view.controls.update();
  }
  document.getElementById('chest').addEventListener('click', function () {
    go(wv, V(2.6, 5.6, 5.8), V(-0.1, 5.2, 0.4));
  });
  document.getElementById('full').addEventListener('click', function () {
    go(wv, V(6.5, 5.2, 16), V(0, 3.5, 0));
  });
  var lblBtn = document.getElementById('lbl');
  lblBtn.addEventListener('click', function () {
    var hidden = app.classList.toggle('hide-labels');
    lblBtn.setAttribute('aria-pressed', String(!hidden));
  });

  function setView(view) {
    current = view;
    app.dataset.view = view.name;
    document.getElementById('tab-device').setAttribute('aria-selected', String(view === dv));
    document.getElementById('tab-worn').setAttribute('aria-selected', String(view === wv));
    [dv, wv].forEach(function (v) {
      var act = v === view;
      v.controls.enabled = act;
      v.controls.autoRotate = act && !reduce;
      v.g.style.display = act ? '' : 'none';
      v.defs.forEach(function (d) { d.el.style.display = act ? '' : 'none'; });
    });
    spin.setAttribute('aria-pressed', String(!reduce));
    spin.textContent = reduce ? 'Giro detenido' : 'Giro automático';
    lastAz = current.controls.getAzimuthalAngle();
    turned = 0;
    resize();
  }
  document.getElementById('tab-device').addEventListener('click', function () { setView(dv); });
  document.getElementById('tab-worn').addEventListener('click', function () { setView(wv); });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    [dv, wv].forEach(function (v) {
      v.camera.aspect = w / h;
      v.camera.zoom = Math.min(1, (w / h) / v.zoomAspect);
      v.camera.updateProjectionMatrix();
    });
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  function layout(view) {
    var w = stage.clientWidth, h = stage.clientHeight;
    var lw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lw')) || 210;
    ['l', 'r'].forEach(function (side) {
      var items = [];
      view.defs.forEach(function (d) {
        var shown = !d.vis || d.vis();
        d.el.style.display = shown ? '' : 'none';
        d.line.style.display = shown ? '' : 'none';
        d.dot.style.display = shown ? '' : 'none';
        if (shown && d.side === side) items.push(d);
      });
      items.forEach(function (d) {
        var v = d.anchor().project(view.camera);
        d.ax = (v.x * 0.5 + 0.5) * w;
        d.ay = (-v.y * 0.5 + 0.5) * h;
        d.hgt = d.el.offsetHeight;
      });
      items.sort(function (a, b) { return a.ay - b.ay; });
      var prev = 6;
      items.forEach(function (d) {
        var y = Math.max(d.ay - d.hgt / 2, prev);
        d.ly = y;
        prev = y + d.hgt + 6;
      });
      var over = prev - 6 - (h - 6);
      if (over > 0) items.forEach(function (d) { d.ly = Math.max(6, d.ly - over); });
      items.forEach(function (d) {
        d.el.style.transform = 'translateY(' + d.ly.toFixed(1) + 'px)';
        var x1 = side === 'l' ? 12 + lw : w - 12 - lw;
        var y1 = d.ly + d.hgt / 2;
        d.line.setAttribute('x1', x1.toFixed(1));
        d.line.setAttribute('y1', y1.toFixed(1));
        d.line.setAttribute('x2', d.ax.toFixed(1));
        d.line.setAttribute('y2', d.ay.toFixed(1));
        d.dot.setAttribute('cx', d.ax.toFixed(1));
        d.dot.setAttribute('cy', d.ay.toFixed(1));
      });
    });
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!dragging && Math.abs(goalT - curT) > 0.0005) {
      curT += (goalT - curT) * (reduce ? 1 : 0.07);
      slider.value = curT.toFixed(3);
    }
    applyT(curT);
    current.controls.update();
    trackTurn();
    renderer.render(current.scene, current.camera);
    if (!app.classList.contains('hide-labels')) layout(current);
  }

  setView(dv);
  frame();
})();
</script>
</body>
</html>
